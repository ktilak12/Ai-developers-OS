version: '3.8'

services:
  project-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ai-developer-os/sandbox:latest
    container_name: ai_dev_os_sandbox
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro  # Mount host repository as read-only by default
    tmpfs:
      - /tmp:size=64m,exec
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
          pids: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - NODE_ENV=test
      - CI=true
      - PYTHONUNBUFFERED=1
    command: ["tail", "-f", "/dev/null"]
