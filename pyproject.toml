[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-developers-os"
version = "0.1.0"
description = "An agentic AI operating system for software developers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tilak", email = "tilakabhi0212@gmail.com" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
